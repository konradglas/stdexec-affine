name: toolchains

# Builds the library's tests and examples with the compilers its users ship with.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The stdexec revision the library is tested against (see CMakeLists.txt).
  STDEXEC_REVISION: fb944c333ae00d11cc0c56e1fb9b2bce04b5e162

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple clang)
            os: macos-latest
            configure: ""
            run_tests: true
          - name: Windows (MSVC)
            os: windows-latest
            configure: ""
            run_tests: true
          - name: Android (NDK clang, arm64)
            os: ubuntu-latest
            configure: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
            run_tests: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/stdexec
          ref: ${{ env.STDEXEC_REVISION }}
          path: stdexec
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTDEXEC_AFFINE_BUILD_TESTS=ON -DSTDEXEC_AFFINE_STDEXEC_SOURCE_DIR="$GITHUB_WORKSPACE/stdexec" ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        if: matrix.run_tests
        run: ctest --test-dir build -C Release --output-on-failure
